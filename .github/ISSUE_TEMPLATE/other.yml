name: 💬 Discussion / new skill proposal / other
description: New skill proposals, usage discussion, acknowledgments, or general feedback
title: "[Discussion] "
labels: ["discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for non-bug discussion: new skill proposals, usage questions, acknowledgments, or general feedback.
        For a skill failure, data error, or concrete improvement request, use the dedicated template so the required reproduction details are collected.
  - type: textarea
    id: content
    attributes:
      label: Topic
      description: Explain what you want to discuss or propose. For a new skill, describe the research problem it solves and how it differs from existing skills.
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
        - label: This is not a skill bug, data error, or concrete improvement request that belongs in another template
          required: true
