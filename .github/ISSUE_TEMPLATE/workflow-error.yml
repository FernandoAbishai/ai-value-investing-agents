name: Workflow error
description: Report a reproducible problem in a canonical workflow, generated skill, or prompt.
title: "[Workflow]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for incorrect instructions, broken paths, missing variables, contradictory gates, or unusable output contracts. Do not include credentials, private portfolio data, or machine-specific usernames.
  - type: input
    id: workflow
    attributes:
      label: Workflow
      description: Enter the exact workflow or skill name.
      placeholder: investment-research
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Claude Code
        - OpenAI Codex skill
        - OpenAI Codex prompt
        - Canonical Markdown source
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Repository version
      description: Provide a release tag or commit SHA.
      placeholder: v1.0.0 or 275107d
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Reproduction request
      description: Provide the complete request with confidential details removed.
      render: text
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Explain what happened and include the relevant non-sensitive error output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain the correct workflow behavior or output contract.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Add source links, affected paths, or a minimal excerpt. Do not paste paid or confidential source material.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, private paths, unpublished holdings, and confidential information.
          required: true
        - label: I checked that this is not already reported in an open issue.
          required: true
