name: 💡 Improvement suggestion
description: Suggest an improvement to report format, skill workflow, or framework behavior
title: "[Suggestion] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please include a concrete example: which report/table/workflow shows the problem and what you would like to change.
        Abstract feedback without a specific location is difficult to act on and may require follow-up.
  - type: textarea
    id: problem
    attributes:
      label: Observed problem and exact location
      description: Which report, section, or table shows the problem? Add a link or screenshot when possible and quote the relevant excerpt.
      placeholder: |
        reports/example.md has a comparison table where companies use different currencies,
        so the values cannot be compared directly.
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: Desired improvement
      description: A concrete "current behavior → desired behavior" example is ideal.
      placeholder: |
        Current: market-cap values mix currencies.
        Desired: normalize cross-market absolute values to one stated currency and disclose the FX rate.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
        - label: I provided a concrete source location and desired outcome
          required: true
