name: 📉 Data error (price / market cap / financials)
description: Report a wrong stock price, market capitalization, valuation, or financial figure
title: "[Data] "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Data issues must include verifiable evidence: security, incorrect value, expected value, and a source link.
        General claims that "the data is often wrong" cannot be verified without a concrete example.
  - type: input
    id: ticker
    attributes:
      label: Security / ticker
      placeholder: "NVIDIA NVDA / Tencent 0700.HK / Kweichow Moutai 600519"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Affected skill or report
      description: Identify the generating skill or the exact report path/link.
      placeholder: "reports/example.md or /investment-research"
    validations:
      required: true
  - type: textarea
    id: wrong-value
    attributes:
      label: Incorrect value
      description: State the field (price, market cap, P/E, revenue, etc.) and the value shown in the report.
      placeholder: "The report shows market cap as HKD 4.33T."
    validations:
      required: true
  - type: textarea
    id: correct-value
    attributes:
      label: Correct value and source
      description: Provide the expected value, a verifiable source link, and any relevant adjustment such as splits, issuance, FX conversion, or restatement.
      placeholder: |
        Expected: approximately HKD 4.65T.
        Source: https://example.com/source
        Reason: the report used an outdated share count.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction command / steps
      placeholder: "/investment-research Tencent"
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
        - label: I provided the expected value and a verifiable source link
          required: true
