name: 🐞 Skill bug / cannot run
description: A skill fails, hangs, or cannot run because a tool or parameter is missing
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please provide concrete, reproducible information. Reports without reproduction details cannot be diagnosed and may be closed pending more information.
        Search existing issues before submitting a new one.
  - type: dropdown
    id: skill
    attributes:
      label: Affected skill
      description: Which skill failed? Select one whenever possible and keep the title/body consistent.
      options:
        - bottleneck-hunter
        - deep-company-series
        - dyp-ask
        - earnings-review
        - earnings-team
        - financial-data
        - industry-funnel
        - industry-research
        - investment-checklist
        - investment-research
        - investment-team
        - management-deep-dive
        - news-pulse
        - portfolio-review
        - private-company-research
        - quality-screen
        - thesis-drift
        - thesis-tracker
        - wechat-article
        - Unsure
        - Other / multiple skills
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Exact command you ran
      description: Paste the command exactly as entered.
      placeholder: "/investment-team Meituan"
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected result vs actual result
      description: What did you expect, and what actually happened? Include the complete error or log output.
      placeholder: |
        Expected: generate the parallel four-perspective research report.
        Actual: "TeamCreate is not a valid tool" and the workflow stops.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Describe the installation method, environment, and exact sequence needed to reproduce the problem.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model used
      description: Model behavior can differ, so this is important for diagnosis.
      placeholder: "Opus / Sonnet / GPT / other"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and version
      placeholder: "Claude Code CLI (version) / Codex / IDE integration"
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
        - label: I provided reproducible information including command, error, model, and client
          required: true
