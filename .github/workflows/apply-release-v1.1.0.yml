name: Apply v1.1.0 Release Updates

on:
  push:
    branches:
      - release-v1.1.0

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v1.1.0
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply release updates
        run: python3 scripts/apply_release_v1_1_0.py

      - name: Validate release candidate
        env:
          CLAUDE_COMMANDS_DIR: ${{ runner.temp }}/release-claude/commands
          CODEX_HOME: ${{ runner.temp }}/release-codex
          AIVA_STATE_HOME: ${{ runner.temp }}/release-state
        run: |
          python3 scripts/repository_quality.py
          python3 scripts/sync-codex-skills.py --check
          python3 scripts/sync-codex-prompts.py --check
          python3 -m compileall -q scripts tools tests
          python3 -m unittest discover -s tests -v
          ./scripts/install.sh --all --dry-run
          test ! -e "$AIVA_STATE_HOME/manifest.json"
          ./scripts/install.sh --all
          ./scripts/manage.sh doctor --all
          ./scripts/manage.sh update --all
          ./scripts/manage.sh uninstall --all

      - name: Commit release updates
        run: |
          if git diff --quiet; then
            echo "Release metadata is already updated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md docs/ENGLISH_EDITION.md .github/workflows/release.yml
          git commit -m "prepare v1.1.0 release metadata"
          git push origin HEAD:release-v1.1.0
