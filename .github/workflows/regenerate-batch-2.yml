name: Regenerate Batch Two Artifacts

on:
  push:
    branches:
      - translate-core-skills-batch-2
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: translate-core-skills-batch-2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update translation status
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = '`investment-research`, `investment-team`, `investment-checklist`, `financial-data`, and `news-pulse` translated'
          new = '`investment-research`, `investment-team`, `investment-checklist`, `financial-data`, `news-pulse`, `earnings-review`, `earnings-team`, `management-deep-dive`, `private-company-research`, and `quality-screen` translated'
          if old not in text:
              raise SystemExit('Expected translation status text was not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Regenerate and verify Codex artifacts
        run: |
          python3 scripts/sync-codex-skills.py
          python3 scripts/sync-codex-prompts.py
          python3 scripts/sync-codex-skills.py --check
          python3 scripts/sync-codex-prompts.py --check

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "Artifacts are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md codex-skills codex-prompts
          git commit -m "regenerate Codex artifacts for translation batch two"
          git push origin HEAD:translate-core-skills-batch-2
