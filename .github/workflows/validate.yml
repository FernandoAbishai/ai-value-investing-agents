name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  posix:
    name: Validate ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify generated artifacts
        run: |
          python3 scripts/sync-codex-skills.py --check
          python3 scripts/sync-codex-prompts.py --check

      - name: Compile Python files
        run: python3 -m compileall -q scripts tools tests

      - name: Run repository quality gates
        run: python3 scripts/repository_quality.py

      - name: Run deterministic unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify workflow inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path

          canonical = {path.stem for path in Path('skills').glob('*.md')}
          codex_skills = {path.parent.name for path in Path('codex-skills').glob('*/SKILL.md')}
          prompts = {path.stem for path in Path('codex-prompts').glob('*.md')}
          codex_only = codex_skills - canonical

          assert len(canonical) == 20, f'Expected 20 canonical workflows, found {len(canonical)}'
          assert canonical <= codex_skills, f'Missing Codex packages: {canonical - codex_skills}'
          assert codex_only == {'investment-memo-craft'}, f'Unexpected Codex-only skills: {codex_only}'
          assert canonical == prompts, f'Codex prompt mismatch: {canonical ^ prompts}'
          print('Verified 20 shared workflows and 1 declared Codex-only skill.')
          PY

      - name: Test unified installation lifecycle
        env:
          CLAUDE_COMMANDS_DIR: ${{ runner.temp }}/claude/commands
          CODEX_HOME: ${{ runner.temp }}/codex
          AIVA_STATE_HOME: ${{ runner.temp }}/state
        run: |
          ./scripts/install.sh --all --dry-run
          test ! -e "$AIVA_STATE_HOME/manifest.json"

          ./scripts/install.sh --all
          ./scripts/manage.sh doctor --all
          ./scripts/manage.sh update --all

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          claude = list(Path(os.environ['CLAUDE_COMMANDS_DIR']).glob('*.md'))
          codex_home = Path(os.environ['CODEX_HOME'])
          skills = list((codex_home / 'skills').glob('*/SKILL.md'))
          prompts = list((codex_home / 'prompts').glob('*.md'))
          manifest = json.loads((Path(os.environ['AIVA_STATE_HOME']) / 'manifest.json').read_text())

          assert len(claude) == 20, f'Claude install count: {len(claude)}'
          assert len(skills) == 21, f'Codex skill install count: {len(skills)}'
          assert len(prompts) == 20, f'Codex prompt install count: {len(prompts)}'
          assert (codex_home / 'skills' / 'investment-memo-craft' / 'SKILL.md').is_file()
          assert set(manifest['components']) == {'claude', 'codex-skills', 'codex-prompts'}
          print('Unified installation and manifest verified.')
          PY

          ./scripts/manage.sh uninstall --all
          test -z "$(find "$CLAUDE_COMMANDS_DIR" -maxdepth 1 -name '*.md' -print -quit 2>/dev/null || true)"
          test -z "$(find "$CODEX_HOME/skills" -mindepth 1 -maxdepth 1 -type d -print -quit 2>/dev/null || true)"
          test -z "$(find "$CODEX_HOME/prompts" -maxdepth 1 -name '*.md' -print -quit 2>/dev/null || true)"

      - name: Test backward-compatible installer aliases
        env:
          CLAUDE_COMMANDS_DIR: ${{ runner.temp }}/legacy-claude/commands
          CODEX_HOME: ${{ runner.temp }}/legacy-codex
          AIVA_STATE_HOME: ${{ runner.temp }}/legacy-state
        run: |
          ./scripts/install-claude-commands.sh
          ./scripts/install-codex-skills.sh
          ./scripts/install-codex-prompts.sh
          ./scripts/manage.sh doctor --all

  windows:
    name: Validate Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify generated artifacts and repository quality
        shell: pwsh
        run: |
          python scripts/sync-codex-skills.py --check
          python scripts/sync-codex-prompts.py --check
          python -m compileall -q scripts tools tests
          python scripts/repository_quality.py

      - name: Run deterministic unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Test unified installation lifecycle
        shell: pwsh
        env:
          CLAUDE_COMMANDS_DIR: ${{ runner.temp }}\claude\commands
          CODEX_HOME: ${{ runner.temp }}\codex
          AIVA_STATE_HOME: ${{ runner.temp }}\state
        run: |
          cmd /c scripts\install.bat --all --dry-run
          if ($LASTEXITCODE -ne 0) { throw 'Unified dry run failed' }
          if (Test-Path "$env:AIVA_STATE_HOME\manifest.json") { throw 'Dry run created a manifest' }

          cmd /c scripts\install.bat --all
          if ($LASTEXITCODE -ne 0) { throw 'Unified installation failed' }

          cmd /c scripts\manage.bat doctor --all
          if ($LASTEXITCODE -ne 0) { throw 'Doctor failed after installation' }

          cmd /c scripts\manage.bat update --all
          if ($LASTEXITCODE -ne 0) { throw 'Unified update failed' }

          $claude = (Get-ChildItem $env:CLAUDE_COMMANDS_DIR -Filter *.md).Count
          $skills = (Get-ChildItem "$env:CODEX_HOME\skills" -Directory).Count
          $prompts = (Get-ChildItem "$env:CODEX_HOME\prompts" -Filter *.md).Count

          if ($claude -ne 20) { throw "Claude install count: $claude" }
          if ($skills -ne 21) { throw "Codex skill install count: $skills" }
          if ($prompts -ne 20) { throw "Codex prompt install count: $prompts" }
          if (-not (Test-Path "$env:CODEX_HOME\skills\investment-memo-craft\SKILL.md")) {
            throw 'Missing Codex-only investment-memo-craft skill'
          }

          cmd /c scripts\manage.bat uninstall --all
          if ($LASTEXITCODE -ne 0) { throw 'Unified uninstall failed' }
          if ((Test-Path $env:CLAUDE_COMMANDS_DIR) -and ((Get-ChildItem $env:CLAUDE_COMMANDS_DIR -Filter *.md).Count -ne 0)) {
            throw 'Claude managed files remain after uninstall'
          }
          if ((Test-Path "$env:CODEX_HOME\skills") -and ((Get-ChildItem "$env:CODEX_HOME\skills" -Directory).Count -ne 0)) {
            throw 'Codex skills remain after uninstall'
          }
          if ((Test-Path "$env:CODEX_HOME\prompts") -and ((Get-ChildItem "$env:CODEX_HOME\prompts" -Filter *.md).Count -ne 0)) {
            throw 'Codex prompts remain after uninstall'
          }

      - name: Test backward-compatible installer aliases
        shell: pwsh
        env:
          CLAUDE_COMMANDS_DIR: ${{ runner.temp }}\legacy-claude\commands
          CODEX_HOME: ${{ runner.temp }}\legacy-codex
          AIVA_STATE_HOME: ${{ runner.temp }}\legacy-state
        run: |
          cmd /c scripts\install-claude-commands.bat
          if ($LASTEXITCODE -ne 0) { throw 'Legacy Claude installer failed' }
          cmd /c scripts\install-codex-skills.bat
          if ($LASTEXITCODE -ne 0) { throw 'Legacy Codex skill installer failed' }
          cmd /c scripts\install-codex-prompts.bat
          if ($LASTEXITCODE -ne 0) { throw 'Legacy Codex prompt installer failed' }
          cmd /c scripts\manage.bat doctor --all
          if ($LASTEXITCODE -ne 0) { throw 'Doctor failed for legacy aliases' }
