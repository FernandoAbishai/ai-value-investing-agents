name: Regenerate Batch Three Artifacts

on:
  push:
    branches:
      - translate-core-skills-batch-3
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: translate-core-skills-batch-3
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate and verify Codex artifacts
        run: |
          python3 scripts/sync-codex-skills.py
          python3 scripts/sync-codex-prompts.py
          python3 scripts/sync-codex-skills.py --check
          python3 scripts/sync-codex-prompts.py --check

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "Artifacts are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-skills codex-prompts
          git commit -m "regenerate Codex artifacts for translation batch three"
          git push origin HEAD:translate-core-skills-batch-3
