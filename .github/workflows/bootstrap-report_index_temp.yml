name: Bootstrap report index (temporary)

on:
  push:
    branches:
      - chore/bootstrap-report-index

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate report index from exact branch contents
        run: |
          python3 tools/reports_index.py
          python3 tools/reports_index.py --check

      - name: Verify generator touched only expected outputs
        run: |
          python3 - <<'PY'
          import subprocess

          allowed = {'reports/README.md', 'reports/index.json'}
          changed = set(subprocess.check_output(
              ['git', 'status', '--porcelain=v1', '-z'], text=False
          ).decode('utf-8', 'replace').split('\0'))
          paths = set()
          for row in changed:
              if not row:
                  continue
              path = row[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              paths.add(path)
          unexpected = paths - allowed
          if unexpected:
              raise SystemExit(f'Unexpected generated changes: {sorted(unexpected)}')
          if not paths:
              raise SystemExit('Generator produced no index outputs')
          print('Generated outputs:', ', '.join(sorted(paths)))
          PY

      - name: Commit generated outputs to bootstrap branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/README.md reports/index.json
          git commit -m 'Generate report index from tracked archive'
          git push origin HEAD:chore/bootstrap-report-index
