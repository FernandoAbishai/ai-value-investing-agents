name: Apply Installer Documentation Updates

on:
  push:
    branches:
      - unified-installer

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: unified-installer
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply documentation updates
        run: python3 scripts/apply_installer_docs.py

      - name: Validate manager and documentation
        run: |
          python3 scripts/repository_quality.py
          python3 -m unittest discover -s tests -v

      - name: Commit documentation updates
        run: |
          if git diff --quiet; then
            echo "Documentation is already updated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md AGENTS.md CLAUDE.md CHANGELOG.md docs/ENGLISH_EDITION.md
          git commit -m "document unified installation management"
          git push origin HEAD:unified-installer
