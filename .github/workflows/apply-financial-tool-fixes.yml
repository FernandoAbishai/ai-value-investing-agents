name: Apply Financial Tool Fixes

on:
  push:
    branches:
      - financial-tool-tests

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: financial-tool-tests
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply scoped fixes
        run: python3 scripts/apply_financial_tool_fixes.py

      - name: Run regression suite
        run: python3 -m unittest discover -s tests -v

      - name: Commit corrected tools
        run: |
          if git diff --quiet; then
            echo "Financial tools are already corrected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/financial_rigor.py tools/report_audit.py
          git commit -m "fix financial calculation and audit decision logic"
          git push origin HEAD:financial-tool-tests
