name: Apply Example Documentation Updates

on:
  push:
    branches:
      - verified-english-examples

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: verified-english-examples
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply documentation updates
        run: python3 scripts/apply_example_docs.py

      - name: Run quality gates and tests
        run: |
          python3 scripts/repository_quality.py
          python3 -m unittest discover -s tests -v

      - name: Commit documentation updates
        run: |
          if git diff --quiet; then
            echo "Documentation is already updated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md docs/ENGLISH_EDITION.md
          git commit -m "document verified English research examples"
          git push origin HEAD:verified-english-examples
