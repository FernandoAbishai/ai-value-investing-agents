name: Publish Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve release version
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          VERSION="$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1 | sed -nE 's/^Release (v[0-9]+\.[0-9]+\.[0-9]+).*$/\1/p')"
          if [ -z "$VERSION" ]; then
            echo 'Commit title does not contain a valid semantic version.' >&2
            exit 1
          fi
          NOTES="docs/releases/${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            echo "Missing release notes: $NOTES" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Validate release commit
        run: |
          python3 scripts/sync-codex-skills.py --check
          python3 scripts/sync-codex-prompts.py --check
          python3 -m compileall -q scripts tools
          python3 - <<'PY'
          from pathlib import Path

          canonical = {path.stem for path in Path('skills').glob('*.md')}
          skills = {path.parent.name for path in Path('codex-skills').glob('*/SKILL.md')}
          prompts = {path.stem for path in Path('codex-prompts').glob('*.md')}
          assert len(canonical) == 20
          assert canonical == skills == prompts
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.version.outputs.notes }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
            exit 0
          fi

          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "AI Value Investing Agents $VERSION — English Edition" \
            --notes-file "$NOTES"
