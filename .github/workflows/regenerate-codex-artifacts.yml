name: Regenerate Codex Artifacts

on:
  push:
    branches:
      - regenerate-codex-artifacts
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out regeneration branch
        uses: actions/checkout@v4
        with:
          ref: regenerate-codex-artifacts
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate Codex skills and prompts
        run: |
          python3 scripts/sync-codex-skills.py
          python3 scripts/sync-codex-prompts.py
          python3 scripts/sync-codex-skills.py --check
          python3 scripts/sync-codex-prompts.py --check

      - name: Commit regenerated artifacts
        run: |
          if git diff --quiet; then
            echo "Generated artifacts are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-skills codex-prompts
          git commit -m "regenerate Codex skills and prompts"
          git push origin HEAD:regenerate-codex-artifacts
