<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">AI Value Investing Agents social preview</title>
  <desc id="desc">Dark social preview graphic for the v1.0.0 English Edition, showing a research network and an evidence-to-decision chart.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a101c"/>
      <stop offset="1" stop-color="#111d2b"/>
    </linearGradient>
    <radialGradient id="greenGlow" cx="100%" cy="0" r="70%">
      <stop offset="0" stop-color="#1cbe87" stop-opacity=".28"/>
      <stop offset="1" stop-color="#1cbe87" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#1f3042" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#greenGlow)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity=".9"/>

  <rect x="72" y="80" width="12" height="480" rx="6" fill="#2ac48b"/>

