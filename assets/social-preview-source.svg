  <text x="108" y="418" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#b5c7d2">Multi-agent investment research workflows</text>
  <text x="108" y="453" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#b5c7d2">for Claude Code and OpenAI Codex</text>

  <rect x="104" y="512" width="206" height="50" rx="25" fill="#111e2b" stroke="#385061"/>
